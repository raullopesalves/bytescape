[package]
name = "bytescape-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end for the Bytescape scanner"

[[bin]]
name = "bytescape-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
bytescape-categories = { path = "../categories" }
bytescape-scanner = { path = "../scanner" }
