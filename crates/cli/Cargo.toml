[package]
name = "diskmap-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line front end for the diskmap scanner"

[[bin]]
name = "diskmap-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
diskmap-categories = { path = "../categories" }
diskmap-scanner = { path = "../scanner" }
