[package]
name = "diskmap-dupes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Duplicate file finder for diskmap scan trees"

[lib]
name = "dupes"

[dependencies]
blake3 = "1.8.7"
diskmap-scanner = { path = "../scanner" }
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
