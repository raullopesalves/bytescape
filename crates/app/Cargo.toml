[package]
name = "diskmap-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop app for diskmap: scan a drive and browse what takes up space"

[[bin]]
name = "diskmap"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
diskmap-categories = { path = "../categories" }
diskmap-scanner = { path = "../scanner" }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-window-state = "2.5.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
