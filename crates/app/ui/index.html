<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bytescape</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/core.js" defer></script>
  <script src="js/tree.js" defer></script>
  <script src="js/treemap.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/basket.js" defer></script>
  <script src="js/views.js" defer></script>
  <script src="js/settings.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <button id="pick" class="primary">New scan</button>
    <button id="rescan" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg>Rescan</button>
    <button id="cancel" hidden>Cancel</button>
    <button id="elevate" hidden title="Reads the drive's file table directly, which is several times faster. Windows asks for permission first.">Scan faster as administrator</button>
    <button id="update" class="update-btn" hidden>Update available</button>
    <!-- Commands on the selection; shown with the results only (style.css). -->
    <span class="cmd-sep main-only"></span>
    <button id="basket-add" class="quiet main-only" title="Add the selected items to the cleanup basket, or take them out (B)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4l1 1h3v2H2V2h3zM3 5h10l-1 10H4z"/></svg><span id="basket-add-label">Add to basket</span></button>
    <button id="export" class="quiet main-only" title="Save this folder's contents, or the search results, as CSV or JSON"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>Export…</button>
    <button id="reveal" class="quiet main-only" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4A1.5 1.5 0 0 1 3 2.5h3.2l1.5 1.5H13A1.5 1.5 0 0 1 14.5 5.5v6.5A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/></svg>Show in Explorer</button>
    <div id="status" class="status" aria-live="polite"></div>
    <label class="search main-only"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><input id="f-name" type="search" placeholder="Search names (* and ? work too)" aria-label="Name"></label>
  </header>

  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="logo-slot"></div>
      <div class="splash-name">Bytescape</div>
    </div>
  </div>

  <div id="start" class="start" hidden>
    <div class="start-inner">
      <div class="start-head">
        <div class="logo-slot small"></div>
        <div>
          <h1>What do you want to scan?</h1>
          <p>Pick a drive or a folder. Bytescape maps what's in it and sorts everything into categories.</p>
        </div>
      </div>
      <section>
        <h2>Drives</h2>
        <div class="drive-grid" id="drives"></div>
      </section>
      <section>
        <h2>Folders</h2>
        <div class="place-grid" id="places"></div>
      </section>
      <section id="recent-section" hidden>
        <h2>Recent</h2>
        <div class="recent" id="recent"></div>
      </section>
      <div class="start-actions">
        <button id="pick-empty" class="primary big">Browse for a folder…</button>
        <form class="path-form" id="path-form">
          <input id="path-in" spellcheck="false" placeholder="Or type a path: D:\Games, \\server\share" aria-label="Folder or network path to scan">
          <button class="big">Scan</button>
        </form>
        <button id="start-back" class="big" hidden>Back to results</button>
      </div>
      <p class="version-line">Bytescape <span id="app-version"></span> · <button class="link" id="start-settings">Settings</button>
        · <button class="link" id="check-updates">Check for updates</button> · <button class="link" id="start-about">About</button></p>
    </div>
  </div>

  <div id="scanning" class="scanning" hidden>
    <div class="scan-card">
      <div class="logo-slot loader"></div>
      <h1>Scanning</h1>
      <p class="scan-path" id="scan-path"></p>
      <p class="scan-stage" id="scan-stage" hidden></p>
      <div class="scan-stats">
        <div><b id="ss-files">0</b><span>files</span></div>
        <div><b id="ss-dirs">0</b><span>folders</span></div>
        <div><b id="ss-bytes">0 B</b><span>found</span></div>
      </div>
      <div class="scan-bar" aria-hidden="true"><span></span></div>
      <p class="note" id="ss-time">Starting…</p>
      <button id="scan-cancel">Cancel</button>
    </div>
  </div>

  <main id="main" hidden>
    <nav class="nav" aria-label="Drives and views">
      <h2>Drives</h2>
      <div class="nav-drives" id="nav-drives"></div>
      <h2>Views</h2>
      <div class="nav-views" id="viewbar" role="tablist" aria-orientation="vertical">
        <button data-view="overview" role="tab"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1.5" width="6" height="13" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>Overview</button>
        <button data-view="tree" role="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 3.5h12M5 8h9M5 12.5h9M2.5 6v6.5H4"/></svg>Folders</button>
        <button data-view="results" role="tab" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>Results</button>
        <button data-view="types" role="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.5h5l3 3v10H4z M9 1.5v3h3"/></svg>File types</button>
        <button data-view="history" role="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>History</button>
        <button data-view="dupes" role="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="4.5" width="8" height="10" rx="1"/><path d="M5 4.5V1.5h9.5v9.5h-5"/></svg>Duplicates</button>
      </div>
      <h2>Cleanup</h2>
      <div class="nav-views">
        <button id="basket-open" title="Open the cleanup basket. Right-click anything, or press B, to add it; nothing is deleted until you review it."><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4l1 1h3v2H2V2h3zM3 5h10l-1 10H4z"/></svg>Basket<span id="basket-count" class="nb-badge"></span></button>
      </div>
      <p class="note" id="rules-note"></p>
      <button id="settings" class="nav-settings" title="Settings and About"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>Settings</button>
    </nav>

    <div class="right" id="right">
      <div class="addr-row">
        <nav class="address" id="address" aria-label="Location of the selected item"></nav>
        <span id="f-summary" class="f-summary" aria-live="polite"></span>
        <button id="f-toggle" class="quiet" aria-expanded="false" aria-controls="filters" title="Filter by extension, size, date and category"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h12l-4.5 5.5v4.5l-3 1.5V8.5z"/></svg>Filters</button>
      </div>
      <section class="tree" aria-label="Folder tree">
        <div class="filters" id="filters" role="search" hidden>
          <input id="f-ext" type="text" placeholder="Extensions: mp4, mkv" aria-label="Extensions">
          <select id="f-min" aria-label="At least">
            <option value="">Any size</option>
            <option value="1048576">≥ 1 MB</option>
            <option value="10485760">≥ 10 MB</option>
            <option value="104857600">≥ 100 MB</option>
            <option value="1073741824">≥ 1 GB</option>
            <option value="10737418240">≥ 10 GB</option>
          </select>
          <select id="f-max" aria-label="At most">
            <option value="">No limit</option>
            <option value="1024">≤ 1 KB</option>
            <option value="1048576">≤ 1 MB</option>
            <option value="104857600">≤ 100 MB</option>
            <option value="1073741824">≤ 1 GB</option>
          </select>
          <select id="f-age" aria-label="Modified">
            <option value="">Any date</option>
            <option value="-7">Changed in the last week</option>
            <option value="-30">Changed in the last month</option>
            <option value="-365">Changed in the last year</option>
            <option value="365">Not changed for 1 year</option>
            <option value="1095">Not changed for 3 years</option>
          </select>
          <select id="f-cat" aria-label="Category">
            <option value="">All categories</option>
          </select>
          <label title="Also match folders (by name, total size, date and category)"><input type="checkbox" id="f-folders"> Folders</label>
          <label title="Show the matches inside their folders, like the tree, instead of one list by size"><input type="checkbox" id="f-group" checked> Group by folder</label>
          <button id="f-clear" class="link" hidden>Clear</button>
        </div>
        <div class="overview" id="overview" hidden></div>
        <div class="overview" id="history" hidden></div>
        <div class="overview" id="dupes" hidden></div>
        <div class="overview" id="types" hidden></div>
        <div class="thead" id="thead" role="row">
          <div data-key="name" role="columnheader">Name</div>
          <div data-key="size" class="num" role="columnheader">Size</div>
          <div role="columnheader">% of parent</div>
          <div data-key="alloc" class="num" role="columnheader">On disk</div>
          <div data-key="files" class="num" role="columnheader">Files</div>
          <div data-key="modified" class="num" role="columnheader">Modified</div>
          <div data-key="category" role="columnheader">Category</div>
        </div>
        <div class="scroller" id="scroller" tabindex="0" role="tree">
          <div id="spacer"></div>
          <div id="rows"></div>
        </div>
      </section>
    </div>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

    <aside class="details" id="details" aria-label="Details">
      <section class="selinfo" id="selinfo" aria-live="polite"></section>
      <section class="map" id="map-pane" aria-label="Treemap">
        <nav class="crumbs" id="crumbs" aria-label="Treemap location"></nav>
        <div class="map-wrap" id="map-wrap">
          <canvas id="map"></canvas>
          <canvas id="map-overlay"></canvas>
          <div class="tip" id="tip" hidden></div>
        </div>
      </section>
    </aside>
  </main>

  <footer class="statusbar" id="statusbar" hidden>
    <span id="selpath" class="selpath"></span>
  </footer>
  <div class="menu" id="menu" role="menu" hidden></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
</body>
</html>
