name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # Build scripts (Tauri's) keep absolute paths in target, so the key
      # names the repository: after a rename the checkout path changes.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ github.event.repository.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ github.event.repository.name }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The Recycle Bin test is #[ignore]d: it would leave a folder in the
      # runner's Recycle Bin. Everything else uses temporary folders.
      - name: Test
        run: cargo test --locked

      # The real UI with a mocked Rust side, in headless Edge (on the runner).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: UI tests
        run: node crates/app/ui-test/run.mjs
